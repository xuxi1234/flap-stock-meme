name: BNBX multisig incoming history read-only
on:
  push:
    branches: [main]
    paths: [.github/workflows/bnbx-incoming-1003.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node scripts/bnbx-incoming-1003/query.mjs
        env:
          FLAP_BSC_RPC_URL: ${{ secrets.FLAP_BSC_RPC_URL }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bnbx-multisig-incoming
          path: bnbx-incoming-output/
