name: Read-only BSC address audit bdd8
on:
  push:
    branches: [main]
    paths: [.github/workflows/audit-bdd8-transfers-1102.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - env:
          RPC: ${{ secrets.FLAP_BSC_RPC_URL }}
        run: |
          node --input-type=module <<'JS'
          const address='0xbdd8f40e4c599d4db5b6e7a4d4f72a8cd1fa8e35';
          let id=0;
          async function rpc(method,params){const r=await fetch(process.env.RPC,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:++id,method,params}),signal:AbortSignal.timeout(45000)});const j=await r.json();if(j.error)throw Error(JSON.stringify(j.error));return j.result;}
          const block=await rpc('eth_blockNumber',[]), tag='0x'+(BigInt(block)-30n).toString(16);
          const [chain,nonce,balance,code,b]=await Promise.all([rpc('eth_chainId',[]),rpc('eth_getTransactionCount',[address,tag]),rpc('eth_getBalance',[address,tag]),rpc('eth_getCode',[address,tag]),rpc('eth_getBlockByNumber',[tag,false])]);
          const result={address,chain,block:Number(BigInt(tag)),time:Number(BigInt(b.timestamp)),nonce:Number(BigInt(nonce)),balanceWei:BigInt(balance).toString(),codeBytes:(code.length-2)/2,codePrefix:code.slice(0,102)};
          result.tokenBalances={};
          for(const token of ['0xa623e650bf970244cf027b9f16f9247d14d17777','0x4b112e1ed0c0cb332d2b39e5dae3bba882f67777']){try{result.tokenBalances[token]=BigInt(await rpc('eth_call',[{to:token,data:'0x70a08231'+address.slice(2).padStart(64,'0')},tag])).toString();}catch(e){result.tokenBalances[token]={error:e.message};}}
          try{result.indexedIncoming=await rpc('alchemy_getAssetTransfers',[{fromBlock:'0x0',toBlock:tag,toAddress:address,category:['external','erc20'],maxCount:'0x64',order:'desc',withMetadata:true}]);}catch(e){result.indexedIncomingError=e.message;}
          const topic='0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef', addr='0x'+address.slice(2).padStart(64,'0');
          result.recentTransferLogs=[];result.logErrors=[];
          const end=Number(BigInt(tag)),start=Math.max(0,end-1000000);
          for(let from=start;from<=end;from+=50000){for(const direction of ['in','out']){try{const logs=await rpc('eth_getLogs',[{fromBlock:'0x'+from.toString(16),toBlock:'0x'+Math.min(end,from+49999).toString(16),topics:direction==='in'?[topic,null,addr]:[topic,addr]}]);result.recentTransferLogs.push(...logs.map(l=>({direction,token:l.address,hash:l.transactionHash,block:Number(BigInt(l.blockNumber)),from:'0x'+l.topics[1].slice(-40),to:'0x'+l.topics[2].slice(-40),data:l.data})));}catch(e){result.logErrors.push({from,direction,error:e.message});}}}
          result.logsFromBlock=start;
          try{result.indexedOutgoing=await rpc('alchemy_getAssetTransfers',[{fromBlock:'0x0',toBlock:tag,fromAddress:address,category:['external','erc20'],maxCount:'0xa',order:'desc',withMetadata:true}]);}catch(e){result.indexedOutgoingError=e.message;}
          console.log(JSON.stringify(result));
          await import('node:fs').then(fs=>fs.writeFileSync('audit.json',JSON.stringify(result,null,2)));
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audit-bdd8
          path: audit.json
