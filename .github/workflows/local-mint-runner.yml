name: Mint runner - offline CI

on:
  pull_request:
    paths:
      - 'scripts/mint-acceptance/**'
      - '.github/workflows/local-mint-runner.yml'
      - '.github/workflows/mint-acceptance.yml'

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/mint-acceptance/package-lock.json
      - run: npm ci --ignore-scripts --prefix scripts/mint-acceptance
      - run: npm test --prefix scripts/mint-acceptance
      - run: node scripts/mint-acceptance/simulate.mjs

# No private key, mainnet RPC, execute mode or broadcast in CI.
