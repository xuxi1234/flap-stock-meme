name: Airdrop runner - offline checks
on:
  pull_request:
    paths: ['scripts/mint-acceptance/**', 'src/airdrop/distributor.json', '.github/workflows/airdrop*.yml']
  push:
    branches: [main]
    paths: ['scripts/mint-acceptance/**', 'src/airdrop/distributor.json', '.github/workflows/airdrop*.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --prefix scripts/mint-acceptance
      - run: node --test scripts/mint-acceptance/airdrop-tests.mjs scripts/mint-acceptance/timed-airdrop-tests.mjs
      - run: npm test --prefix scripts/mint-acceptance
