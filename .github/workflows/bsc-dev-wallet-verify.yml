name: BSC development wallet verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/bsc-dev-wallet-verify.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned address derivation library without scripts
        working-directory: ${{ runner.temp }}
        run: npm install --ignore-scripts --no-audit --no-fund ethers@6.15.0
      - name: Verify key address and read BSC balance without signing
        working-directory: ${{ runner.temp }}
        env:
          DEV_PRIVATE_KEY: ${{ secrets.BSC_DEV_PRIVATE_KEY_0XB75A48493E7AEA9FF6B817C5716A722C8F687777 }}
          BSC_RPC_URL: ${{ secrets.FLAP_BSC_RPC_URL }}
        run: |
          node --input-type=module <<'NODE'
          import { Wallet, formatEther } from 'ethers';
          const expected = '0xb75a48493e7aea9ff6b817c5716a722c8f687777';
          async function main() {
            let key = (process.env.DEV_PRIVATE_KEY || '').trim();
            if (!key) throw new Error('SECRET_MISSING');
            if (!key.startsWith('0x')) key = '0x' + key;
            if (!/^0x[0-9a-fA-F]{64}$/.test(key)) throw new Error('KEY_FORMAT_INVALID');
            let address;
            try { address = new Wallet(key).address; } catch { throw new Error('KEY_INVALID'); }
            if (address.toLowerCase() !== expected) throw new Error('ADDRESS_MISMATCH');
            console.log('Secret present: YES');
            console.log('Private key matches expected address: YES');
            console.log('Address: ' + address);
            const url = (process.env.BSC_RPC_URL || '').trim();
            if (!url) throw new Error('RPC_MISSING');
            async function rpc(method, params = []) {
              try {
                const response = await fetch(url, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({jsonrpc: '2.0', id: 1, method, params}),
                  signal: AbortSignal.timeout(30000)
                });
                if (!response.ok) throw new Error();
                const data = await response.json();
                if (data.error || typeof data.result !== 'string' || !/^0x[0-9a-fA-F]*$/.test(data.result)) throw new Error();
                return data.result;
              } catch { throw new Error('RPC_READ_FAILED'); }
            }
            const chain = BigInt(await rpc('eth_chainId'));
            if (chain !== 56n) throw new Error('WRONG_CHAIN');
            const block = await rpc('eth_blockNumber');
            const [balance, nonce, pending, code] = await Promise.all([
              rpc('eth_getBalance', [address, block]),
              rpc('eth_getTransactionCount', [address, block]),
              rpc('eth_getTransactionCount', [address, 'pending']),
              rpc('eth_getCode', [address, block])
            ]);
            const report = {
              checked_at: new Date().toISOString(), address, key_matches: true,
              chain_id: Number(chain), block: BigInt(block).toString(),
              balance_bnb: formatEther(BigInt(balance)),
              confirmed_nonce: BigInt(nonce).toString(),
              pending_nonce: BigInt(pending).toString(),
              has_contract_code: code !== '0x',
              transactions_sent: 0
            };
            console.log(JSON.stringify(report, null, 2));
            const {appendFileSync} = await import('node:fs');
            appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              '## BSC development wallet verification\n\n' +
              '| Check | Result |\n|---|---|\n' +
              '| Private key matches expected address | YES |\n' +
              '| Address | ' + address + ' |\n' +
              '| Chain | BSC mainnet (56) |\n' +
              '| Block | ' + report.block + ' |\n' +
              '| BNB balance | ' + report.balance_bnb + ' |\n' +
              '| Confirmed nonce | ' + report.confirmed_nonce + ' |\n' +
              '| Pending nonce | ' + report.pending_nonce + ' |\n' +
              '| Contract code present | ' + report.has_contract_code + ' |\n' +
              '| Transactions sent | 0 |\n');
          }
          main().catch(e => {
            const allowed = ['SECRET_MISSING','KEY_FORMAT_INVALID','KEY_INVALID','ADDRESS_MISMATCH','RPC_MISSING','RPC_READ_FAILED','WRONG_CHAIN'];
            console.error('Verification failed: ' + (allowed.includes(e.message) ? e.message : 'CHECK_FAILED'));
            process.exitCode = 1;
          });
          NODE
