name: 蝴蝶持仓空投｜7018地址·36批·每30分钟
on:
  pull_request:
    paths:
      - .github/workflows/airdrop-image12.yml
      - scripts/mint-acceptance/image12-*.mjs
      - scripts/mint-acceptance/data/image12-*
  workflow_dispatch:
    inputs:
      operation:
        description: '固定7018地址：12代币快照仅去重；每地址转出0.1枚，税费按合约扣除，每批200，间隔至少30分钟'
        type: choice
        default: 只读检查
        options: [只读检查, 执行或继续持仓名单]
        required: true
      confirm:
        description: '确认固定名单每地址转出0.1枚（税费按合约扣除、不补发）、200地址一批、至少30分钟一批；含历史支出的累计上限0.2 BNB'
        type: boolean
        default: false
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: flap-mint-acceptance-bsc56-79f8
  cancel-in-progress: false
jobs:
  check:
    name: 检查启动状态、到期时间及链上记录
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      slots: ${{ steps.check.outputs.slots }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --prefix scripts/mint-acceptance
      - run: node --test scripts/mint-acceptance/image12-tests.mjs scripts/mint-acceptance/holders18-budget-tests.mjs scripts/mint-acceptance/image12-integration-tests.mjs
      - id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IMAGE12_OPERATION: ${{ inputs.operation == '执行或继续持仓名单' && 'start' || 'check' }}
          IMAGE12_CONFIRM: ${{ inputs.confirm && 'image12x0.1:200:1800seconds:budget0.2:lifetime' || '' }}
          IMAGE12_PHASE: check
          FLAP_BSC_RPC_URL: ${{ secrets.FLAP_BSC_RPC_URL }}
          AIRDROP_REPORT_DIR: ${{ runner.temp }}/image12-check
        run: node scripts/mint-acceptance/image12-main.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: image12-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image12-check/
          retention-days: 90
          if-no-files-found: ignore
  execute:
    name: 持仓空投步骤 ${{ matrix.slot }}
    needs: check
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        slot: ${{ fromJSON(needs.check.outputs.slots) }}
    if: needs.check.outputs.ready == 'true' && github.ref == 'refs/heads/main' && inputs.operation == '执行或继续持仓名单' && inputs.confirm == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --prefix scripts/mint-acceptance
      - name: 核对预算并执行本次到期轮次
        if: github.event_name == 'workflow_dispatch' && inputs.operation == '执行或继续持仓名单' && inputs.confirm == true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IMAGE12_OPERATION: start
          IMAGE12_CONFIRM: ${{ inputs.confirm && 'image12x0.1:200:1800seconds:budget0.2:lifetime' || '' }}
          IMAGE12_PHASE: execute
          FLAP_MINT_PRIVATE_KEY: ${{ secrets.FLAP_MINT_PRIVATE_KEY }}
          FLAP_BSC_RPC_URL: ${{ secrets.FLAP_BSC_RPC_URL }}
          AIRDROP_REPORT_DIR: ${{ runner.temp }}/image12-results
        run: node scripts/mint-acceptance/image12-chain.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: image12-results-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.slot }}
          path: ${{ runner.temp }}/image12-results/
          retention-days: 90
          if-no-files-found: ignore
