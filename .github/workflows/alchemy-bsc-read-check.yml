name: Alchemy BSC read-only connection check
on:
  push:
    paths:
      - '.github/workflows/alchemy-bsc-read-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check BSC chain and latest block
        env:
          RPC_URL: ${{ secrets.ALCHEMY_BSC_RPC_URL }}
        run: |
          node <<'NODE'
          (async () => {
            if (!process.env.RPC_URL) throw new Error('RPC secret missing');
            const request = async (method) => {
              const r = await fetch(process.env.RPC_URL, {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params:[]})});
              if (!r.ok) throw new Error('RPC HTTP failure: ' + r.status);
              const data = await r.json();
              if (data.error || !data.result) throw new Error('RPC returned an error');
              return data.result;
            };
            const chain = await request('eth_chainId');
            if (chain !== '0x38') throw new Error('RPC is not BSC mainnet');
            console.log('BSC mainnet connection OK; chain ID:', parseInt(chain,16));
            console.log('Latest block:', parseInt(await request('eth_blockNumber'),16));
          })().catch(() => {console.error('RPC check failed; verify endpoint and permissions');process.exit(1)});
          NODE
