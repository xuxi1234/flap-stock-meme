name: 蝴蝶羊最新前400持仓｜空投名单只读核验
on:
  push:
    branches: [main]
    paths: [.github/workflows/sheep-top400-1027.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sheep-top400-1027-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --prefix scripts/mint-acceptance
      - run: node scripts/holders18/collect1024.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FLAP_BSC_RPC_URL: ${{ secrets.FLAP_BSC_RPC_URL }}
          HOLDERS_TOKEN_FILE: scripts/sheep-top400-1027/tokens.json
          HOLDERS_TOKEN_INDEX: '0'
          HOLDERS_TOP_N: '400'
          HOLDERS_BRANCH: automation/sheep-top400-1027
      - run: node scripts/sheep-top400-1027/prepare.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FLAP_BSC_RPC_URL: ${{ secrets.FLAP_BSC_RPC_URL }}
          HOLDERS_BRANCH: automation/sheep-top400-1027
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sheep-top400-1027
          path: holders18-output/
