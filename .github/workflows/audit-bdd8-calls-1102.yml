name: Read-only recent bdd8 calls
on:
  push:
    paths: ['.github/workflows/audit-bdd8-calls-1102.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - env:
          RPC: ${{ secrets.FLAP_BSC_RPC_URL }}
        run: |
          node --input-type=module <<'JS'
          const address='0xbdd8f40e4c599d4db5b6e7a4d4f72a8cd1fa8e35';
          let id=0;
          async function rpc(method,params){const r=await fetch(process.env.RPC,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:++id,method,params})});const j=await r.json();if(j.error)throw Error(JSON.stringify(j.error));return j.result;}
          const matches=[];
          for(let n=131199296;n<=131199429;n+=5){
            const blocks=await Promise.all(Array.from({length:Math.min(5,131199430-n)},(_,i)=>rpc('eth_getBlockByNumber',['0x'+(n+i).toString(16),true])));
            for(const b of blocks)for(const tx of b.transactions)if(tx.from?.toLowerCase()===address)matches.push({...tx,timestamp:b.timestamp});
          }
          for(const tx of matches){const receipt=await rpc('eth_getTransactionReceipt',[tx.hash]);const code=tx.to?await rpc('eth_getCode',[tx.to,tx.blockNumber]):null;console.log(JSON.stringify({tx,receipt,toCodeBytes:code?(code.length-2)/2:null}));}
          console.log('MATCH_COUNT',matches.length);
          JS
