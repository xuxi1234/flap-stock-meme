name: USDT holder API check
on:
  push:
    branches: [usdt-holder-check-20261114]
    paths: [.github/workflows/usdt-holder-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public snapshot services
        run: |
          python3 <<'PY'
          import requests,re
          for url in ['https://www.pandatool.org/zh-CN/tool/snapshot','https://bscscan.com/token/0x55d398326f99059ff775485246999027b3197955#balances','https://www.gtokentool.com/en/tool/snapshot']:
              try:
                  r=requests.get(url,timeout=25,headers={'User-Agent':'Mozilla/5.0'})
                  print('SITE',url,'STATUS',r.status_code,'LENGTH',len(r.content))
                  print('JS',re.findall(r'<script[^>]+src="([^"]+)"',r.text)[:20])
                  print('CSVLINK',re.findall(r'href="([^"]*(?:csv|export)[^"]*)"',r.text,re.I)[:10])
              except Exception as e: print('FAIL',type(e).__name__)
          PY
