name: USDT holder API check
on:
  push:
    branches: [usdt-holder-check-20261114]
    paths: [.github/workflows/usdt-holder-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect snapshot API
        run: |
          python3 <<'PY'
          import requests,re
          s=requests.get('https://www.pandatool.org/_next/static/chunks/10c6p9ry-sudu.js',timeout=30).text
          for pattern in ['exportFailed','pageSize','holders','snapshot','/api/']:
            print('PATTERN',pattern)
            for m in list(re.finditer(pattern,s,re.I))[:12]:
              print(s[max(0,m.start()-400):m.start()+500])
          PY
