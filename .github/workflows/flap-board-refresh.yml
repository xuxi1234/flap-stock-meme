name: Flap 看板｜付费 RPC 只读采集｜60秒更新
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/flap-board/**', '.github/workflows/flap-board-refresh.yml']
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: flap-board-readonly-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test scripts/flap-board/core.test.mjs
      - name: 每60秒更新链上分类与行情快照（不签名、不发送交易）
        run: node scripts/flap-board/collect.mjs
        env:
          FLAP_BSC_RPC_URL: ${{ secrets.FLAP_BSC_RPC_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          COLLECT_MINUTES: '23'
