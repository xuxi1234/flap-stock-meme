name: 18币按指定人数｜合并去重CSV
on:
  push:
    branches: [main]
    paths: [.github/workflows/holders-1028-eighteen.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: holders-1028-eighteen
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      block: ${{ steps.snapshot.outputs.block }}
      hash: ${{ steps.snapshot.outputs.hash }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: scripts/holders18
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - id: snapshot
        env:
          FLAP_BSC_RPC_URL: ${{ secrets.FLAP_BSC_RPC_URL }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {rpc,hex} from './scripts/holders18/io.mjs';
          if(BigInt(await rpc('eth_chainId',[]))!==56n)throw Error('Wrong chain');
          const block=Number(BigInt(await rpc('eth_blockNumber',[])))-30;
          const data=await rpc('eth_getBlockByNumber',[hex(block),false]);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`block=${block}\nhash=${data.hash}\n`);
          JS
  collect:
    needs: snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - token: 0
            top: 1000
          - token: 1
            top: 1000
          - token: 2
            top: 500
          - token: 3
            top: 400
          - token: 4
            top: 500
          - token: 5
            top: 300
          - token: 6
            top: 500
          - token: 7
            top: 500
          - token: 8
            top: 200
          - token: 9
            top: 500
          - token: 10
            top: 500
          - token: 11
            top: 500
          - token: 12
            top: 1000
          - token: 13
            top: 500
          - token: 14
            top: 1000
          - token: 15
            top: 500
          - token: 16
            top: 1000
          - token: 17
            top: 500
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/holders18
            scripts/holders-1028-eighteen
            scripts/mint-acceptance
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --prefix scripts/mint-acceptance
      - run: node --test scripts/holders18/core.test.mjs scripts/holders18/multicall.test.mjs
      - name: Read-only on-chain holder snapshot
        env:
          FLAP_BSC_RPC_URL: ${{ secrets.FLAP_BSC_RPC_URL }}
          HOLDERS_SNAPSHOT: ${{ needs.snapshot.outputs.block }}
          HOLDERS_TOKEN_INDEX: ${{ matrix.token }}
          HOLDERS_TOKEN_FILE: scripts/holders-1028-eighteen/tokens.json
          HOLDERS_TOP_N: ${{ matrix.top }}
        run: node scripts/holders18/collect1024.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: 1028-eighteen-token-${{ matrix.token }}
          path: holders18-output/
          retention-days: 30
  finalize:
    needs: [snapshot,collect]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: scripts/holders-1028-eighteen
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: 1028-eighteen-token-*
          path: holder-input
          merge-multiple: true
      - run: node scripts/holders-1028-eighteen/finalize.mjs
        env:
          HOLDERS_SNAPSHOT: ${{ needs.snapshot.outputs.block }}
          HOLDERS_SNAPSHOT_HASH: ${{ needs.snapshot.outputs.hash }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 1028-eighteen-deduplicated-final
          path: holder-export/
          retention-days: 90
