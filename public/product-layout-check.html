<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>官网布局检查</title><style>body{margin:0;background:#eceaf0;font:14px system-ui}header{padding:12px;display:flex;gap:20px;flex-wrap:wrap}select{padding:8px}iframe{display:block;margin:auto;border:1px solid #999;height:900px;max-width:100%;box-sizing:border-box}</style></head><body><header><label>宽度 <select id="width" aria-label="预览宽度"><option>320</option><option selected>390</option><option>768</option><option>1280</option></select></label><label>页面 <select id="page" aria-label="预览页面"><option value="/?lang=zh">中文首页</option><option value="/?lang=en">英文首页</option><option value="/nft?lang=en">英文 NFT</option></select></label></header><iframe title="官网响应式预览" id="preview" src="/?lang=zh" width="390"></iframe><script>document.getElementById('width').onchange=function(){document.getElementById('preview').width=this.value};document.getElementById('page').onchange=function(){document.getElementById('preview').src=this.value}</script></body></html>
